spring:
  application:
    name: ms-andesstay-rabbit-admin
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AZURE_ISSUER_URI:https://login.microsoftonline.com/fbf645d5-8f6d-45fc-9e8d-c8866d008af1/v2.0}

server:
  port: ${SERVER_PORT:8086}

andesstay:
  security:
    audience: ${AZURE_API_AUDIENCE:api://d6959b0c-9ec2-432e-bddb-54bd0e83ace9}
    roles-claim: roles
  rabbit-admin:
    # Topologia de la que depende el sistema (declarada por notify y reservations): la API
    # rechaza eliminarla con 409 para que una llamada de administracion no corte las
    # notificaciones. Se pueden crear y borrar libremente colas/exchanges con otros nombres.
    protected-queues:
      - q.cmd.email
      - q.cmd.email.dlq
      - q.cmd.email.retry
      - q.cmd.housekeeping
      - q.cmd.housekeeping.dlq
      - q.cmd.housekeeping.retry
      - q.cmd.voucher
      - q.cmd.voucher.dlq
      - q.cmd.voucher.retry
    protected-exchanges:
      - cmd.direct
      - cmd.topic
      - cmd.dead.dlx
      - cmd.retry

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    rabbit:
      enabled: true

logging:
  level:
    com.andesstay: INFO
